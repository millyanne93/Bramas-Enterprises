{% extends 'owner/base.html' %}
{% block content %}
<div class="container">
    <div class="d-flex justify-content-end mb-3">
        <a class="btn btn-teal" href="{% url 'owner_login' %}">Login</a>
        <a class="btn btn-teal ml-2" href="/">Home</a>
    </div>

    <!-- Display Messages -->
    {% if messages %}
        <div class="mx-auto" style="max-width: 400px;">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <div class="d-flex justify-content-center align-items-center" style="min-height: 600px;">
        <div>
            <h2 class="text-center">Owner Registration Form</h2>
            <form class="mx-auto" style="max-width: 400px;" action="{% url 'owner_registration' %}" method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="firstname" class="form-label">First Name</label>
                    <input type="text" id="firstname" name="firstname" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="lastname" class="form-label">Last Name</label>
                    <input type="text" id="lastname" name="lastname" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="mobile" class="form-label">Mobile Number</label>
                    <input type="tel" id="mobile" name="mobile" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="city" class="form-label">City</label>
                    <input type="text" id="city" name="city" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="pincode" class="form-label">Pincode</label>
                    <input type="text" id="pincode" name="pincode" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="contact_info" class="form-label">Contact Info (Optional)</label>
                    <input type="text" id="contact_info" name="contact_info" class="form-control">
                </div>
                <div class="d-grid">
                    <input type="submit" value="Register" class="btn rounded-pill py-2" style="background-color: #b57edc; border-color: #b57edc; color: white;">
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'owner/base.html' %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center">Owner Login</h2>
    
    <!-- Display Messages -->
    {% if messages %}
        <div class="mx-auto" style="max-width: 400px;">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <form class="mx-auto" style="max-width: 400px;" method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <div class="d-grid">
            <input type="submit" value="Login" class="btn rounded-pill py-2" style="background-color: #b57edc; border-color: #b57edc; color: white;">
        </div>
    </form>
    <div class="text-center mt-3">
        <p>Not registered? <a href="{% url 'owner_register' %}">Register here</a>.</p>
    </div>
</div>
{% endblock %}
